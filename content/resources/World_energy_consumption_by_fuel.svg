<title>World Energy Consumption</title>
<desc>Translations are included for Arabic, Chinese, Dutch, English, Finnish, French, German, Italian, Japanese, Polish, Portuguese, Russian, Spanish, and Swedish. Other languages can easily be added.</desc>
<!-- background -->
<rect width="100%" fill="#fff" height="100%"/>
<!--
	CALCULATIONS:
		x1 = Origin + Radius*cos(0)
		y1 = Origin + Radius*sin(0)

		x2 = Origin + Radius*cos(Angle1)
		y2 = Origin + Radius*sin(Angle1)

		x3 = Origin + Radius*cos(Angle2)
		y3 = Origin + Radius*sin(Angle2)
	EXAMPLE:
		For a pie chart that starts at 300, 300 (centered at 300,300), and with a radius of 250, and with data of 32.36%, 23.73%, 30.06%, 4.42%, 9.37%

		Section	Color	Slice	Angle	x	y
					0	550	300
		A	brown	32.36%	116.5	188.45	523.73
		B	blue	23.73%	201.9	68.04	206.75
		C	gray	30.06%	310.1	461.03	108.77
		D	orange	4.42%	326.1	507.50	160.56
		E	green	9.37%	360	550.00	300.00

		Path goes from center to outside right, then along arc clockwise to point 1, then back to center. Next path goes from center to last point, then along arc to the next point, then back to the center. The last section goes from the center to the last point, then along the arc to the starting point. The color of each section is set by the fill.

		<path fill="brown" stroke="black" stroke-width="1" d="M300,300  L550,300  A250,250 0 0,1 188.45,523.73 z"/>
		<path fill="blue" stroke="black" stroke-width="1" d="M300,300  L188.45,523.73  A250,250 0 0,1 68.04,206.75 z"/>
		<path fill="gray" stroke="black" stroke-width="1" d="M300,300  L68.04,206.75  A250,250 0 0,1 461.03,108.77 z"/>
		<path fill="orange" stroke="black" stroke-width="1" d="M300,300  L461.03,108.77  A250,250 0 0,1 507.50,160.56 z"/>
		<path fill="green" stroke="black" stroke-width="1" d="M300,300  L507.50,160.56  A250,250 0 0,1 550,300 z"/>

-->


<g font-family="Verdana, Tahoma, sans-serif" transform="translate(-40 -65)" text-anchor="middle">
<!-- Chart -->
