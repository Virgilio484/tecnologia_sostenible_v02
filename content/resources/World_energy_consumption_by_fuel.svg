		<!-- Coal -->
		<path fill="gray" stroke="black" stroke-width="1" d="M300,300  L181.0529,519.8899  A250,250 0 0,1 118.3110,128.2761 z"/>
		<!-- Natural Gas -->
		<path fill="lightblue" stroke="black" stroke-width="1" d="M300,300  L118.3110,128.2761  A250,250 0 0,1 452.6268,101.9973 z"/>
		<!-- Nuclear -->
		<path fill="orange" stroke="black" stroke-width="1" d="M300,300  L452.6268,101.9973  A250,250 0 0,1 501.1406,151.5329 z"/>
		<!-- Hydroelectric -->
		<path fill="blue" stroke="black" stroke-width="1" d="M300,300  L501.1406,151.5329  A250,250 0 0,1 544.5180,247.9334 z"/>
		<!-- Wind -->
		<path fill="green" stroke="black" stroke-width="1" d="M300,300  L544.5180,247.9334  A250,250 0 0,1 548.2326,270.3254 z"/>
		<!-- Solar -->
		<path fill="yellow" stroke="black" stroke-width="1" d="M300,300  L548.2326,270.3254  A250,250 0 0,1 548.9505,277.1172 z"/>
